syntax = "proto3";

package speaker.query.v1;

option go_package = "speaker/query/v1;speakerquery";
option java_package = "com.speaker.query.v1";
option java_multiple_files = true;

////////////////////////////////////////////////////////////
// 实体管理服务（增 / 改 / 删 / 查）
////////////////////////////////////////////////////////////

service SpeakerRegistryService {

  // 注册新实体（通过音频）
  rpc RegisterEntity(RegisterEntityRequest)
      returns (RegisterEntityResponse);

  // 更新已有实体（追加或覆盖特征）
  rpc UpdateEntity(UpdateEntityRequest)
      returns (UpdateEntityResponse);

  // 删除实体
  rpc DeleteEntity(DeleteEntityRequest)
      returns (DeleteEntityResponse);

  // 获取实体基础信息（不做相似度检索）
  rpc GetEntity(GetEntityRequest)
      returns (GetEntityResponse);
}

////////////////////////////////////////////////////////////
// 查询服务（在线推理）
////////////////////////////////////////////////////////////
service SpeakerQueryService {

  // 输入一段音频，返回可能的说话人 / 设备 / 实体
  rpc QuerySpeaker(QuerySpeakerRequest)
      returns (QuerySpeakerResponse);
}


////////////////////////////////////////////////////////////
// 对外实体信息（业务真正关心的对象）
////////////////////////////////////////////////////////////

message EntityInfo {
  // 实体唯一标识
  string entity_id = 1;

  // 实体类型，如 person / device / account
  string entity_type = 2;

  // 业务自定义信息
  map<string, string> metadata = 3;
}

////////////////////////////////////////////////////////////
// 音频输入描述
////////////////////////////////////////////////////////////

message AudioFormat {
  // 采样率，如 16000
  uint32 sample_rate = 1;

  // 声道数，如 1
  uint32 channels = 2;

  // 编码格式，如 pcm16 / wav / flac
  string encoding = 3;
}

////////////////////////////////////////////////////////////
// 查询配置（控制返回行为）
////////////////////////////////////////////////////////////

message QueryConfig {
  // 最多返回多少个候选实体
  // top_k = 1 表示“直接告诉我是谁”
  uint32 top_k = 1;

  // 相似度阈值，低于该值的不返回
  // 0 表示不启用
  float score_threshold = 2;

  // 是否在返回中包含匹配分数
  bool return_score = 3;
}


message QuerySpeakerRequest {
  // 原始音频数据
  bytes audio = 1;

  // 音频格式
  AudioFormat audio_format = 2;

  // 查询行为配置
  QueryConfig query_config = 3;
}

message MatchEntity {
  // 命中的实体信息
  EntityInfo entity = 1;

  // 匹配分数（仅在 return_score = true 时有意义）
  float score = 2;
}

message QuerySpeakerResponse {
  // 匹配到的实体列表
  repeated MatchEntity matches = 1;
}


////////////////////////////////////////////////////////////
// 注册实体
////////////////////////////////////////////////////////////

message RegisterEntityRequest {
  // 实体信息（entity_id 可由调用方指定，或由服务端生成）
  EntityInfo entity = 1;

  // 注册用音频数据
  bytes audio = 2;

  // 音频格式
  AudioFormat audio_format = 3;
}

message RegisterEntityResponse {
  // 最终使用的实体 ID
  string entity_id = 1;
}

////////////////////////////////////////////////////////////
// 更新实体
////////////////////////////////////////////////////////////

message UpdateEntityRequest {
  // 要更新的实体 ID
  string entity_id = 1;

  // 新增或替换用的音频数据
  bytes audio = 2;

  // 音频格式
  AudioFormat audio_format = 3;

  // 是否覆盖已有特征
  // false：追加特征
  // true ：重建该实体的特征
  bool overwrite = 4;

  // 可选：更新 metadata
  map<string, string> metadata = 5;
}

message UpdateEntityResponse {
  string entity_id = 1;
}

////////////////////////////////////////////////////////////
// 删除实体
////////////////////////////////////////////////////////////

message DeleteEntityRequest {
  string entity_id = 1;
}

message DeleteEntityResponse {
  bool success = 1;
}

////////////////////////////////////////////////////////////
// 获取实体信息
////////////////////////////////////////////////////////////

message GetEntityRequest {
  string entity_id = 1;
}

message GetEntityResponse {
  EntityInfo entity = 1;
}
